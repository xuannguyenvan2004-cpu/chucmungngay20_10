<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20/10 - Vũ trụ yêu thương | Nguyễn Văn Xuân</title>
<meta name="author" content="Nguyễn Văn Xuân">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  color-scheme: dark;
  --text: #fff0f7;
  --muted: #e2c3dc;
  --pink: #ff5fa2;
  --gold: #ffd36e;
  --glass: rgba(255,255,255,.09);
  --line: rgba(255,255,255,.18);
}

html {
  scroll-padding-top: env(safe-area-inset-top,0px);
  scroll-behavior: smooth;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  font-family: "Be Vietnam Pro","Segoe UI","Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 20% 15%,#5b1d7a 0,transparent 45%),
    radial-gradient(ellipse at 85% 30%,#1b3a8a 0,transparent 50%),
    radial-gradient(ellipse at 50% 90%,#8a1d5c 0,transparent 55%),
    #0a0618;
  background-attachment: fixed;
}

#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

main {
  position: relative;
  z-index: 1;
}

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 20px 170px;
  position: relative;
}

.badge {
  padding: 6px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(8px);
  font-size: 14px;
  letter-spacing: .5px;
}

.heart {
  width: min(62vw,300px);
  margin: 18px 0 6px;
  animation: beat 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 28px rgba(255,95,162,.8));
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  15% { transform: scale(1.09); }
  30% { transform: scale(1); }
  45% { transform: scale(1.06); }
}

h1 {
  font-family: "Playfair Display","Noto Serif","Times New Roman",serif;
  font-size: clamp(28px,6.5vw,54px);
  line-height: 1.2;
  margin: 10px 0;
}

h1 span {
  background: linear-gradient(90deg,#ff8fc0,#ffd36e,#b79bff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 540px;
  color: var(--muted);
  margin: 0 0 22px;
  font-size: 17px;
}

.btn {
  border: 0;
  cursor: pointer;
  color: #fff;
  padding: 13px 28px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  text-decoration: none;
  display: inline-block;
  background: linear-gradient(135deg,#ff5fa2,#9b5cff);
  box-shadow: 0 0 24px rgba(255,95,162,.5);
}

.btn:active {
  transform: scale(.97);
}

.hint {
  margin-top: 14px;
  font-size: 13px;
  color: var(--muted);
  opacity: .85;
}

.garden {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 160px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(4px,2.4vw,26px);
  pointer-events: none;
  overflow: hidden;
  background: linear-gradient(to top,rgba(20,60,50,.55),transparent);
}

.fl {
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
  animation: sway 3.8s ease-in-out infinite alternate;
}

.fl svg {
  display: block;
  filter: drop-shadow(0 0 10px rgba(255,150,200,.7));
}

.stem {
  width: 4px;
  border-radius: 2px;
  background: linear-gradient(#5fd38d,#1d7a4e);
}

@keyframes sway {
  from { transform: rotate(-5deg); }
  to { transform: rotate(5deg); }
}

section {
  max-width: 980px;
  margin: 0 auto;
  padding: 60px 20px;
}

h2 {
  font-family: "Playfair Display","Noto Serif","Times New Roman",serif;
  font-size: clamp(25px,5vw,36px);
  text-align: center;
  margin: 0 0 8px;
}

.sub {
  text-align: center;
  color: var(--muted);
  margin: 0 0 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}

.card {
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  padding: 24px;
  text-align: center;
  transition: transform .3s;
}

.card:hover {
  transform: translateY(-6px);
}

.card .ic {
  font-size: 36px;
}

.card h3 {
  margin: 8px 0 4px;
  color: var(--gold);
}

.card p {
  margin: 0;
  color: var(--muted);
}

.wish {
  max-width: 640px;
  margin: 0 auto;
  padding: 30px 22px;
  text-align: center;
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(12px);
  border-radius: 26px;
}

input {
  width: 100%;
  max-width: 340px;
  padding: 13px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.3);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  margin-bottom: 14px;
}

input::placeholder {
  color: #b99ab0;
}

#wishText {
  font-family: "Playfair Display","Noto Serif","Times New Roman",serif;
  font-size: clamp(19px,4vw,25px);
  min-height: 90px;
  margin: 0 0 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.count {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.count div {
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(8px);
  border-radius: 18px;
  padding: 14px 18px;
  min-width: 78px;
  text-align: center;
}

.count b {
  display: block;
  font-size: 30px;
  color: var(--gold);
}

.count small {
  color: var(--muted);
}

.msg {
  text-align: center;
  padding: 36px 22px;
  border-radius: 26px;
  border: 1px solid var(--line);
  background: linear-gradient(
    135deg,
    rgba(255,95,162,.25),
    rgba(155,92,255,.25)
  );
}

.msg p {
  max-width: 620px;
  margin: 10px auto;
  font-size: 18px;
}

footer {
  text-align: center;
  padding: 24px 20px 44px;
  color: var(--muted);
  font-size: 14px;
}

.ov {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8,4,22,.86);
  backdrop-filter: blur(6px);
}

.ov[hidden] {
  display: none;
}

body.lock {
  overflow: hidden;
}

body.lock #fx {
  z-index: 20;
}

.gbox {
  max-width: 420px;
  width: 100%;
  text-align: center;
  padding: 30px 22px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 26px;
}

.gh {
  font-size: 54px;
  animation: beat 1.6s ease-in-out infinite;
}

.gbox input,
.gbox select {
  display: block;
  width: 100%;
  margin: 0 auto 12px;
  padding: 13px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.3);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  text-align-last: center;
  max-width: none;
}

.gbox option {
  background: #1d1030;
  color: #fff;
}

#gErr {
  min-height: 22px;
  color: #ff9ab8;
  font-size: 14px;
  margin-bottom: 10px;
}

.shake {
  animation: shake .4s;
}

@keyframes shake {
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

#scene {
  text-align: center;
  max-width: 680px;
}

#scene .s {
  animation: sin 1s both;
}

#scene h3 {
  font-family: "Playfair Display","Noto Serif","Times New Roman",serif;
  font-size: clamp(26px,6vw,46px);
  line-height: 1.3;
  margin: 0 0 10px;
}

#scene h3 em {
  font-style: normal;
  background: linear-gradient(90deg,#ff8fc0,#ffd36e,#b79bff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#scene p {
  color: var(--muted);
  font-size: clamp(16px,3.5vw,20px);
  margin: 0;
}

@keyframes sin {
  from {
    opacity: 0;
    transform: translateY(24px) scale(.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.bar {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: calc(28px + env(safe-area-inset-bottom,0px));
  height: 4px;
  border-radius: 2px;
  background: var(--line);
}

.bar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 2px;
  background: linear-gradient(90deg,#ff5fa2,#ffd36e);
}

.skip,
.replay {
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.skip {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top,0px));
  right: 16px;
}

.replay {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom,0px));
  z-index: 5;
}

.replay[hidden],
.mute[hidden] {
  display: none;
}

.mute {
  position: fixed;
  left: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom,0px));
  z-index: 30;
  width: 42px;
  height: 42px;
  padding: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(8px);
  color: var(--text);
  border-radius: 50%;
  cursor: pointer;
}

.ka p {
  margin: 12px 0;
  opacity: 0;
  transform: translateY(14px) scale(.96);
  transition: opacity .45s,transform .45s;
  font-size: clamp(17px,4vw,24px);
  color: var(--text);
}

.ka p.on {
  opacity: 1;
  transform: none;
}

.w {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px) scale(.85);
  transition: opacity .35s,transform .35s cubic-bezier(.2,1.6,.4,1);
}

.w.on {
  opacity: 1;
  transform: none;
}

#scene.beat {
  animation: bp .3s ease-out;
}

@keyframes bp {
  0% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.np {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top,0px));
  left: 16px;
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  background: var(--glass);
  border-radius: 999px;
  padding: 8px 14px;
  max-width: 60vw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
